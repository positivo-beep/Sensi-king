name: Verificar y compilar NEXORA SYSTEM 2026
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4
      - name: Verificación previa
        run: |
          python3 scripts/verificar_base_estable_y_rainbow.py
          python3 scripts/verificar_no_regresion_nexora.py
          python3 scripts/verificar_vigilancia_base_funcional.py
          # Test estructural sin nuevas descargas obligatorias
          python3 scripts/verificar_estabilidad_nexora_entrega.py
          python3 scripts/verificar_panel_entrada_ligera.py
          python3 scripts/verificar_build11_interfaz_y_limpieza.py
          python3 scripts/verificar_build12_interfaz_roja.py
          python3 scripts/verificar_nexora_autoupdate.py
          python3 scripts/verificar_build14_compatibilidad_original.py
          python3 scripts/verificar_build15_integracion_real.py
          python3 scripts/verificar_build16_revisiones_automaticas.py
          python3 scripts/verificar_build16r_activacion_previa.py
          python3 scripts/verificar_textura_alok.py
          python3 scripts/verificar_holo_pj_oscuro_rainbow.py
          python3 scripts/verificar_catalogo_y_assets.py
          python3 scripts/verificar_recursos_completos.py
          python3 scripts/verificar_nexora.py
          python3 scripts/verificar_integracion_nexora.py
          python3 scripts/verificar_opciones_v14.py
          python3 scripts/verificar_seguridad_licencias.py
          python3 scripts/verificar_restauracion_v21_1.py
          python3 scripts/verificar_audio_personalizado_v21_2.py
          python3 scripts/verificar_temporales_nexora_v21_3.py
          python3 scripts/verificar_version_original_v21_5.py
          python3 scripts/verificar_conservacion_actualizaciones_v21_6.py
          python3 scripts/verificar_concurrencia_temporales_nexora.py
          # Prueba de archivo propio, no de acceso a contenedores externos.
          swiftc ThreeOneOSFive/helpers/FileReplacementService.swift \
            scripts/PruebaReemplazoNX.swift -o "$RUNNER_TEMP/nexora-file-test"
          "$RUNNER_TEMP/nexora-file-test"
          xcodebuild -version
          xcodebuild -list -project ThreeOneOSFive.xcodeproj
      - name: Compilar para iOS sin firmar
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ThreeOneOSFive.xcodeproj \
            -scheme NEXORA_SYSTEM_2026 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcodebuild.log
      - name: Empaquetar IPA sin firma
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/3105.app"
          test -d "$APP"
          python3 scripts/verificar_build12_ipa.py "$APP"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName NEXORA SYSTEM 2026' "$APP/Info.plist" || \
            /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string NEXORA SYSTEM 2026' "$APP/Info.plist"
          mkdir -p "$PWD/package/Payload"
          cp -R "$APP" "$PWD/package/Payload/"
          (cd "$PWD/package" && zip -qr "$OLDPWD/NEXORA_SYSTEM_2026_3105_sin_firmar.ipa" Payload)
      - name: Entregar IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA_SYSTEM_2026_3105_sin_firmar
          path: NEXORA_SYSTEM_2026_3105_sin_firmar.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Guardar informe de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA_LOG_COMPILACION
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
